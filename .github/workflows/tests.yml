name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: for f in $(find assets sw.js tests -name '*.js'); do node --check "$f"; done
      - name: Run tests
        run: node tests/run-node.js
