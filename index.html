<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A private, offline record keeper for street outreach: where someone stays, what they are working toward, their story, and documents you can print or email.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a7a68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>LifeGain369</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/refine.css">
<link rel="stylesheet" href="assets/css/features.css">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>

<div class="app">

  <header class="topbar no-print">
    <div class="brand">
      <div class="mark" aria-hidden="true">🏠</div>
      <div>
        <span class="name">LifeGain369</span>
        <span class="org" id="brand-org">Local records · nothing is uploaded</span>
      </div>
    </div>

    <div class="spacer"></div>

    <nav class="nav" aria-label="Main">
      <button data-action="nav" data-view="today">Today</button>
      <button data-action="nav" data-view="dashboard">Overview</button>
      <button data-action="nav" data-view="people">People</button>
      <button data-action="nav" data-view="settings">Settings</button>
      <button data-action="nav" data-view="help">Help</button>
    </nav>
    <button class="btn sm ghost lock-btn" id="lock-now" data-action="lock-now" hidden title="Lock the app now">🔒 Lock</button>
  </header>

  <main class="main" id="view">
    <div class="card"><p class="muted mb0">Loading your records…</p></div>
  </main>

  <footer class="main no-print" style="padding-top:0;padding-bottom:24px">
    <p class="small faint center mb0">
      Everything stays on this device · <span id="save-dot">Not saved yet</span>
    </p>
  </footer>

</div>

<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif">
    <h2>JavaScript is switched off</h2>
    <p>This app runs entirely inside your browser, so it needs JavaScript enabled. Nothing is sent anywhere.</p>
  </div>
</noscript>

<!-- Plain scripts, not modules, so the app still opens straight from a file.
     Order matters: core, then data, then the UI that uses them. -->
<script src="assets/core/util.js"></script>
<script src="assets/core/config.js"></script>
<script src="assets/core/crypto.js"></script>
<script src="assets/core/store.js"></script>
<script src="assets/core/flow.js"></script>
<script src="assets/core/doc.js"></script>
<script src="assets/core/report.js"></script>
<script src="assets/data/catalogs.js"></script>
<script src="assets/data/resources-nyc.js"></script>
<script src="assets/data/sample-data.js"></script>
<script src="assets/ui/packet-style.js"></script>
<script src="assets/ui/ui.js"></script>
<script src="assets/app.js"></script>
<script src="assets/views/lock.js"></script>
<script src="assets/views/overview.js"></script>
<script src="assets/views/today.js"></script>
<script src="assets/views/people.js"></script>
<script src="assets/views/person.js"></script>
<script src="assets/views/plan.js"></script>
<script src="assets/views/history.js"></script>
<script src="assets/views/documentation.js"></script>
<script src="assets/views/report.js"></script>
<script src="assets/views/settings.js"></script>
<script src="assets/views/help.js"></script>
<script src="assets/actions.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
