<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A private, offline record keeper for street outreach: where someone stays, what they are working toward, their story, and documents you can print or email.">
<meta name="color-scheme" content="light dark">
<title>Outreach Companion</title>
<link rel="stylesheet" href="assets/styles.css?v=8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f6f5c'/><text y='72' x='50' text-anchor='middle' font-size='58'>🏠</text></svg>">
</head>
<body>

<div class="app">

  <header class="topbar no-print">
    <div class="brand">
      <div class="mark" aria-hidden="true">🏠</div>
      <div>
        <span class="name">Outreach Companion</span>
        <span class="org" id="brand-org">Local records · nothing is uploaded</span>
      </div>
    </div>

    <div class="spacer"></div>

    <nav class="nav" aria-label="Main">
      <button data-action="nav" data-view="today">Today</button>
      <button data-action="nav" data-view="dashboard">Overview</button>
      <button data-action="nav" data-view="people">People</button>
      <button data-action="nav" data-view="settings">Settings</button>
      <button data-action="nav" data-view="help">Help</button>
    </nav>
  </header>

  <main class="main" id="view">
    <div class="card"><p class="muted mb0">Loading your records…</p></div>
  </main>

  <footer class="main no-print" style="padding-top:0;padding-bottom:24px">
    <p class="small faint center mb0">
      Everything stays on this device · <span id="save-dot">Not saved yet</span>
    </p>
  </footer>

</div>

<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif">
    <h2>JavaScript is switched off</h2>
    <p>This app runs entirely inside your browser, so it needs JavaScript enabled. Nothing is sent anywhere.</p>
  </div>
</noscript>

<script src="assets/packet-style.js?v=8"></script>
<script src="assets/storage.js?v=8"></script>
<script src="assets/workflow.js?v=8"></script>
<script src="assets/resources-nyc.js?v=8"></script>
<script src="assets/sample-data.js?v=8"></script>
<script src="assets/doc.js?v=8"></script>
<script src="assets/app.js?v=8"></script>
</body>
</html>
